[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vicor"
version = "0.1.0"
description = "Acting by Intent, Reacting by Sight: Visual Conditioned Reflexes for Real-Time VLM Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Qiancheng Zhou" },
  { name = "Wenhua Zhang" },
]
keywords = [
  "vision-language-models",
  "real-time-agents",
  "visual-conditioned-reflex",
  "embodied-ai",
  "game-agents",
]
dependencies = [
  "httpx>=0.27.0",
  "httpx-sse>=0.4.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "Pillow>=10.2.0",
  "PyYAML>=6.0.1",
  "playwright>=1.44.0",
]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.19.0"]
arc3 = ["arc-agi", "arcengine"]

[project.urls]
Paper = "https://arxiv.org/abs/2611.18723"
Repository = "https://github.com/ershiyidian/ViCoR"

[project.scripts]
vicor = "vicor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vicor = [
  "core/prompts/*.md",
  "vista_runtime/vista/core/prompts/*.md",
  "benchmarks/overlays/**/*.yaml",
  "benchmarks/overlays/**/*.py",
  "benchmarks/robodojo/*.py",
]
