task_prompt: Collect parts scattered around the arena and submit ones that match the
  active order at the order counter to maximize score before the match timer runs
  out. For high-grade orders, process the matching part at the workbench before submitting
  it.
evaluator_config:
  objective:
    reach:
      game_state.score: 10.0
  metrics_fields:
  - game_state.score
  - game_state.max_score_seen
  - game_state.survival_time
