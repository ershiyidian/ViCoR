game_rules: 'You are playing a 3D obstacle course. You control a third-person character
  running across a sequence of floating platforms separated by gaps. The goal is to
  reach the finish line. You can move the character forward, backward, left, and right;
  jump; and rotate the view up, down, left, and right.


  ## What you see on screen

  - Solid surfaces are the floating platforms; everything else is open blue sky (void).

  - A 3-minute countdown timer is shown on screen.


  ## Rules

  - Platforms vary in size, shape, height, and lateral offset.

  - Reach the finish before the countdown ends; falling off a platform / into a gap
  fails the episode.


  ## Task Objective

  Run through the 3D obstacle course as fast as possible. Avoid obstacles, jump over
  gaps, and reach the finish line.'
width: 640
height: 360
speed_multiplier: 1.0
game_roles:
- name: player
  prompt:
    role_section: 'You control the player character.

      Run through the 3D obstacle course as fast as possible. Avoid obstacles, jump
      over gaps, and reach the finish line.'
    computer_use_controls_section: 'ACTION SPACE (ONLY LEGAL ACTIONS):

      - Wait: Pause briefly to observe.

      - w: Move forward

      - a: Move left

      - s: Move backward

      - d: Move right

      - Space: Jump

      - ArrowLeft: Turn camera view left

      - ArrowRight: Turn camera view right

      - ArrowUp: Tilt camera view up

      - ArrowDown: Tilt camera view down'
  computer_use_controls:
    allowed_keys:
    - w
    - a
    - s
    - d
    - Space
    - ArrowLeft
    - ArrowRight
    - ArrowUp
    - ArrowDown
    allow_clicks: true
    hold_duration: 0.25
  semantic_controls:
  - id: wait
    description: Wait briefly.
    binding:
      action: wait
      duration: 0.15
  - id: press_w
    description: Move forward
    binding:
      action: press_key
      key: w
      duration: 0.25
  - id: press_a
    description: Move left
    binding:
      action: press_key
      key: a
      duration: 0.25
  - id: press_s
    description: Move backward
    binding:
      action: press_key
      key: s
      duration: 0.25
  - id: press_d
    description: Move right
    binding:
      action: press_key
      key: d
      duration: 0.25
  - id: press_space
    description: Jump
    binding:
      action: press_key
      key: Space
      duration: 0.25
  - id: press_arrowleft
    description: Turn camera view left
    binding:
      action: press_key
      key: ArrowLeft
      duration: 0.25
  - id: press_arrowright
    description: Turn camera view right
    binding:
      action: press_key
      key: ArrowRight
      duration: 0.25
  - id: press_arrowup
    description: Tilt camera view up
    binding:
      action: press_key
      key: ArrowUp
      duration: 0.25
  - id: press_arrowdown
    description: Tilt camera view down
    binding:
      action: press_key
      key: ArrowDown
      duration: 0.25
