game_rules: "You control the silver humanoid character in a top-down 3D arena. Score\
  \ as many points as possible before the timer runs out.\n\n## What you see on screen\n\
  - Labeled part objects and stations are visible in the arena.\n- Top-left: total\
  \ score.\n- Bottom: Game Time countdown and Current orders list (each order shows\
  \ the required part type and its point value).\n- A green label directly above your\
  \ character shows the part you are carrying. After upgrading it becomes \"High-grade\
  \ <part>\". No green label means empty-handed.\n- Interaction prompts (\"PickUp\"\
  , \"Upgrade\", \"Submit\", \"Discard\") appear on screen when you stand close enough\
  \ to the relevant part or station.\n\n## Rules\n- You can carry at most one part\
  \ at a time.\n- An interaction works only when its matching prompt is visible:\n\
  \  - PickUp at a floor part: hold that part.\n  - Submit at the Order Counter: if\
  \ the held part matches an active order, score the order's points and remove it\
  \ from the list.\n  - Upgrade at the WorkBench: convert the held normal part into\
  \ its High-grade version, and the part turns golden yellow.\n  - Discard at the\
  \ Bin: drop the held part, becoming empty-handed.\n- High-grade orders accept only\
  \ High-grade parts; submitting a normal part for a High-grade order does not score.\n\
  - The episode ends when Game Time reaches zero.\n\n## Task Objective\nCollect parts\
  \ scattered around the arena and submit ones that match the active order at the\
  \ order counter to maximize score before the match timer runs out. For high-grade\
  \ orders, process the matching part at the workbench before submitting it."
width: 640
height: 360
speed_multiplier: 1.0
game_roles:
- name: player
  prompt:
    role_section: 'You control the player character.

      Collect parts scattered around the arena and submit ones that match the active
      order at the order counter to maximize score before the match timer runs out.
      For high-grade orders, process the matching part at the workbench before submitting
      it.'
    computer_use_controls_section: 'ACTION SPACE (ONLY LEGAL ACTIONS):

      - Wait: Pause briefly to observe.

      - w: Move up

      - a: Move left

      - s: Move down

      - d: Move right

      - f: Interact (pick up item / submit at order counter / process at workbench
      / discard)'
  computer_use_controls:
    allowed_keys:
    - w
    - a
    - s
    - d
    - f
    allow_clicks: false
    hold_duration: 0.25
  semantic_controls:
  - id: wait
    description: Wait briefly.
    binding:
      action: wait
      duration: 0.15
  - id: press_w
    description: Move up
    binding:
      action: press_key
      key: w
      duration: 0.25
  - id: press_a
    description: Move left
    binding:
      action: press_key
      key: a
      duration: 0.25
  - id: press_s
    description: Move down
    binding:
      action: press_key
      key: s
      duration: 0.25
  - id: press_d
    description: Move right
    binding:
      action: press_key
      key: d
      duration: 0.25
  - id: press_f
    description: Interact (pick up item / submit at order counter / process at workbench
      / discard)
    binding:
      action: press_key
      key: f
      duration: 0.25
