game_rules: "You are playing an NPC exchange task-chain game. You control a character\
  \ in an open environment with NPCs. The objective is to complete the exchange chain\
  \ within the countdown.\n\n## What you see on screen\n- Character camera view.\n\
  - Top-left: status text.\n  - \"Task Finished\" shows task-chain progress.\n  -\
  \ \"Current Inventory\" shows the held item.\n  - \"NPC Hint\" shows an appearance\
  \ or location cue.\n  - \"Task Tips\" shows exchange requirement and reward text.\n\
  - Top-centre: countdown timer.\n- NPCs have red floating name labels.\n\n## Rules\n\
  - The current on-screen task determines the active exchange.\n- Completing a valid\
  \ exchange advances the chain.\n- NPC interaction is available while the [Interaction]\
  \ prompt is visible near an NPC. The prompt disappears outside interaction range.\n\
  - The episode ends when the task chain is completed or the countdown reaches zero.\n\
  \n## Task Objective\nComplete all 10 NPC exchange tasks before the countdown ends.\
  \ Read the task text in the top-left corner, use the NPC hint to find the right\
  \ NPC, and use the interaction button when the [Interaction] prompt is visible."
width: 640
height: 360
speed_multiplier: 1.0
game_roles:
- name: player
  prompt:
    role_section: 'You control the player character.

      Complete all 10 NPC exchange tasks before the countdown ends. Read the task
      text in the top-left corner, use the NPC hint to find the right NPC, and use
      the interaction button when the [Interaction] prompt is visible.'
    computer_use_controls_section: 'ACTION SPACE (ONLY LEGAL ACTIONS):

      - Wait: Pause briefly to observe.

      - w: Move forward

      - a: Move left

      - s: Move backward

      - d: Move right

      - f: Interact with the NPC when the [Interaction] prompt is visible

      - Space: Jump

      - ArrowLeft: Turn camera view left

      - ArrowRight: Turn camera view right

      - ArrowUp: Tilt camera view up

      - ArrowDown: Tilt camera view down'
  computer_use_controls:
    allowed_keys:
    - w
    - a
    - s
    - d
    - f
    - Space
    - ArrowLeft
    - ArrowRight
    - ArrowUp
    - ArrowDown
    allow_clicks: true
    hold_duration: 0.25
  semantic_controls:
  - id: wait
    description: Wait briefly.
    binding:
      action: wait
      duration: 0.15
  - id: press_w
    description: Move forward
    binding:
      action: press_key
      key: w
      duration: 0.25
  - id: press_a
    description: Move left
    binding:
      action: press_key
      key: a
      duration: 0.25
  - id: press_s
    description: Move backward
    binding:
      action: press_key
      key: s
      duration: 0.25
  - id: press_d
    description: Move right
    binding:
      action: press_key
      key: d
      duration: 0.25
  - id: press_f
    description: Interact with the NPC when the [Interaction] prompt is visible
    binding:
      action: press_key
      key: f
      duration: 0.25
  - id: press_space
    description: Jump
    binding:
      action: press_key
      key: Space
      duration: 0.25
  - id: press_arrowleft
    description: Turn camera view left
    binding:
      action: press_key
      key: ArrowLeft
      duration: 0.25
  - id: press_arrowright
    description: Turn camera view right
    binding:
      action: press_key
      key: ArrowRight
      duration: 0.25
  - id: press_arrowup
    description: Tilt camera view up
    binding:
      action: press_key
      key: ArrowUp
      duration: 0.25
  - id: press_arrowdown
    description: Tilt camera view down
    binding:
      action: press_key
      key: ArrowDown
      duration: 0.25
