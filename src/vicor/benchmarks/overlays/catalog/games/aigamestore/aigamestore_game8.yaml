game_rules: 'You are playing bubble-cash.


  ## Game Description

  Match 3 or more bubbles of the same color to pop them. Create chain reactions for
  bonus points. Clear all bubbles before time runs out.


  ## Controls

  - Arrow Left/Right: Rotate shooter

  - Space: Fire bubble

  - Z: Swap current bubble with next

  - Enter: Start game

  - R: Restart'
width: 800
height: 600
speed_multiplier: 1.0
game_roles:
- name: player
  prompt:
    role_section: 'You control the player in bubble-cash.

      Match 3 or more bubbles of the same color to pop them. Create chain reactions
      for bonus points. Clear all bubbles before time runs out.'
    computer_use_controls_section: 'ACTION SPACE (ONLY LEGAL ACTIONS):

      - Wait: Do nothing briefly.

      - ArrowLeft: Rotate shooter left

      - ArrowRight: Rotate shooter right

      - Space: Fire bubble

      - z: Swap current bubble with next'
  computer_use_controls:
    allowed_keys:
    - ArrowLeft
    - ArrowRight
    - Space
    - z
    allow_clicks: false
    hold_duration: 0.18
  semantic_controls:
  - id: wait
    description: Wait briefly.
    binding:
      action: wait
      duration: 0.15
  - id: press_arrowleft
    description: Rotate shooter left
    binding:
      action: press_key
      key: ArrowLeft
      duration: 0.18
  - id: press_arrowright
    description: Rotate shooter right
    binding:
      action: press_key
      key: ArrowRight
      duration: 0.18
  - id: press_space
    description: Fire bubble
    binding:
      action: press_key
      key: Space
      duration: 0.18
  - id: press_z
    description: Swap current bubble with next
    binding:
      action: press_key
      key: z
      duration: 0.18
