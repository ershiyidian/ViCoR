game_rules: 'You are playing battle-zone.


  ## Game Description

  Top-down tactical shooter. Eliminate enemies, collect ammo, and use cover strategically.
  Manage health and ammunition to reach extraction.


  ## Controls

  - Arrow Keys: Move

  - Z: Fire weapon

  - Space: Sprint

  - Shift: Take cover/crouch

  - Enter: Start game

  - Esc: Pause

  - R: Restart'
width: 800
height: 600
speed_multiplier: 1.0
game_roles:
- name: player
  prompt:
    role_section: 'You control the player in battle-zone.

      Top-down tactical shooter. Eliminate enemies, collect ammo, and use cover strategically.
      Manage health and ammunition to reach extraction.'
    computer_use_controls_section: 'ACTION SPACE (ONLY LEGAL ACTIONS):

      - Wait: Do nothing briefly.

      - ArrowUp: Move up

      - ArrowDown: Move down

      - ArrowLeft: Move left

      - ArrowRight: Move right

      - z: Fire weapon

      - Space: Sprint

      - Shift: Take cover / crouch'
  computer_use_controls:
    allowed_keys:
    - ArrowUp
    - ArrowDown
    - ArrowLeft
    - ArrowRight
    - z
    - Space
    - Shift
    allow_clicks: false
    hold_duration: 0.18
  semantic_controls:
  - id: wait
    description: Wait briefly.
    binding:
      action: wait
      duration: 0.15
  - id: press_arrowup
    description: Move up
    binding:
      action: press_key
      key: ArrowUp
      duration: 0.18
  - id: press_arrowdown
    description: Move down
    binding:
      action: press_key
      key: ArrowDown
      duration: 0.18
  - id: press_arrowleft
    description: Move left
    binding:
      action: press_key
      key: ArrowLeft
      duration: 0.18
  - id: press_arrowright
    description: Move right
    binding:
      action: press_key
      key: ArrowRight
      duration: 0.18
  - id: press_z
    description: Fire weapon
    binding:
      action: press_key
      key: z
      duration: 0.18
  - id: press_space
    description: Sprint
    binding:
      action: press_key
      key: Space
      duration: 0.18
  - id: press_shift
    description: Take cover / crouch
    binding:
      action: press_key
      key: Shift
      duration: 0.18
