game_rules: 'You are playing megaman.


  ## Game Description

  Action platformer with boss battles. Defeat bosses to gain their weapons, master
  tight platforming, and conquer the final fortress.


  ## Controls

  - Arrow Left/Right: Move

  - Arrow Up/Down: Aim up/down

  - Z: Jump

  - Space: Shoot

  - Shift: Cycle weapons

  - Enter: Start game

  - Esc: Pause

  - R: Restart'
width: 800
height: 600
speed_multiplier: 1.0
game_roles:
- name: player
  prompt:
    role_section: 'You control the player in megaman.

      Action platformer with boss battles. Defeat bosses to gain their weapons, master
      tight platforming, and conquer the final fortress.'
    computer_use_controls_section: 'ACTION SPACE (ONLY LEGAL ACTIONS):

      - Wait: Do nothing briefly.

      - ArrowLeft: Move left

      - ArrowRight: Move right

      - ArrowUp: Aim up

      - ArrowDown: Aim down

      - z: Jump

      - Space: Shoot

      - Shift: Cycle weapons'
  computer_use_controls:
    allowed_keys:
    - ArrowLeft
    - ArrowRight
    - ArrowUp
    - ArrowDown
    - z
    - Space
    - Shift
    allow_clicks: false
    hold_duration: 0.18
  semantic_controls:
  - id: wait
    description: Wait briefly.
    binding:
      action: wait
      duration: 0.15
  - id: press_arrowleft
    description: Move left
    binding:
      action: press_key
      key: ArrowLeft
      duration: 0.18
  - id: press_arrowright
    description: Move right
    binding:
      action: press_key
      key: ArrowRight
      duration: 0.18
  - id: press_arrowup
    description: Aim up
    binding:
      action: press_key
      key: ArrowUp
      duration: 0.18
  - id: press_arrowdown
    description: Aim down
    binding:
      action: press_key
      key: ArrowDown
      duration: 0.18
  - id: press_z
    description: Jump
    binding:
      action: press_key
      key: z
      duration: 0.18
  - id: press_space
    description: Shoot
    binding:
      action: press_key
      key: Space
      duration: 0.18
  - id: press_shift
    description: Cycle weapons
    binding:
      action: press_key
      key: Shift
      duration: 0.18
