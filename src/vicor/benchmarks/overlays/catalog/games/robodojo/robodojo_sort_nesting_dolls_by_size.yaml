      duration: 0.1
  - id: right_fwd
    description: Move Right TCP forward (+Y)
    binding:
      action: press_key
      key: ArrowUp
      duration: 0.08
  - id: right_back
    description: Move Right TCP backward (-Y)
    binding:
      action: press_key
      key: ArrowDown
      duration: 0.08
  - id: right_left
    description: Move Right TCP left (-X)
    binding:
      action: press_key
      key: ArrowLeft
      duration: 0.08
  - id: right_right
    description: Move Right TCP right (+X)
    binding:
      action: press_key
      key: ArrowRight
      duration: 0.08
  - id: right_up
    description: Move Right TCP up (+Z)
    binding:
      action: press_key
      key: i
      duration: 0.08
  - id: right_down
    description: Move Right TCP down (-Z)
    binding:
      action: press_key
      key: k
      duration: 0.08
  - id: right_yaw_ccw
    description: Yaw Right wrist CCW
    binding:
